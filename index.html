<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Character Sheet Portfolio</title>
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
        <!-- Fallback if JavaScript is disabled -->
        <noscript><meta http-equiv="refresh" content="6;url=./index.html"></noscript>
        <style>
            html, body {
                margin: 0;
                height: 100%;
                background-color: #3a2a1a;
                overflow: hidden;
            }

            #splash-screen {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #0f0f1e 100%);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 9999;
                animation: fadeOut 1s ease-out 5s forwards;
            }

            @keyframes fadeOut {
                0% {
                    opacity: 1;
                    visibility: visible;
                }
                100% {
                    opacity: 0;
                    visibility: hidden;
                }
            }

            #dice-container {
                width: 400px;
                height: 400px;
                margin-bottom: 30px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .triangle-container {
                position: relative;
                width: 500px;
                height: 450px;
                animation: pulse 2s ease-in-out infinite;
            }

            .triangle-container img {
                max-width: 100%;
                height: auto;
            }

            @keyframes pulse {
                0%, 100% {
                    transform: scale(1);
                    filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6));
                }
                50% {
                    transform: scale(1.05);
                    filter: drop-shadow(0 0 40px rgba(255, 215, 0, 0.9));
                }
            }

            .critical-success {
                font-family: 'Cinzel', serif;
                font-size: 48px;
                font-weight: bold;
                color: #ffd700;
                text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 0 0 40px rgba(255, 215, 0, 0.5);
                opacity: 0;
                animation: criticalSuccess 1.5s ease-in-out 1.5s forwards;
            }

            @keyframes criticalSuccess {
                0% {
                    opacity: 0;
                    transform: scale(0.5);
                }
                50% {
                    opacity: 1;
                    transform: scale(1.2);
                }
                100% {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            @media (max-width: 640px) {
                #dice-container {
                    width: 300px;
                    height: 300px;
                }
                .critical-success {
                    font-size: 36px;
                }
            }
        </style>
    </head>
    <body>
        <div id="splash-screen">
            <div id="dice-container">
                <div class="triangle-container">
                    <img src="./d20.png" alt="d-20"/>
                </div>
            </div>
            <div class="critical-success" id="critical-text">CRITICAL SUCCESS!</div>
        </div>

        <script>
            // Show the splash for 5s, let it fade out for 1s, then go to the home page.
            // replace() keeps the splash out of the back-button history.
            setTimeout(function () {
                window.location.replace('./index.html');
            }, 6000);
        </script>
    </body>
</html>
